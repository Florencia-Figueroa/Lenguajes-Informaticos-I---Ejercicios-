<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 — Badge sobre imagen con position:absolute</title>
    <link rel="stylesheet" href="CSS/E3.css">
</head>
<body>
    <div class="producto">
        <div class="imagen-container">
            <img src="https://picsum.photos/300/200" alt="Producto">
            <span class="badge-oferta">🔥🔥 Oferta</span>
        </div>
        <div class="info">
            <h3>Nombre del producto</h3>
            <p>Precio: $1.200</p>
        </div>
    </div>
</body>
