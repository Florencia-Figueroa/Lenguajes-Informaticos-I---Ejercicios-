<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Sintaxis y CSS Básico</title>
    <!-- Vinculación del archivo CSS según las instrucciones -->
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body>

    <header>
        <!-- id="titulo-principal" para probar el id -->
        <h1 id="titulo-principal">Título Principal de la Página</h1>
        
        <!-- Enlaces dentro de <nav> para probar el selector descendente -->
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Servicios</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <main>
        <h2>Subtítulo de la sección</h2>
        
        <!-- Párrafo común para probar el selector de tipo 'p' -->
        <p>Este es un párrafo de texto normal donde se aplica el color y tamaño base.</p>

        <!-- Elemento con clase "destacado" para probar el selector de clase -->
        <p class="destacado">Este es un párrafo destacado con fondo amarillo.</p>

        <!-- Un enlace fuera del nav para probar el comportamiento general y :hover -->
        <p>Para más información, visitá nuestro <a href="#">enlace externo</a>.</p>
    </main>

</body>
</html>
