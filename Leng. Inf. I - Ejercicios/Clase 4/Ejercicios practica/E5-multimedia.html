<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
</head>
<body>
    <p>Escucha nuestro audio:</p>
    <audio controls>
        <source src="audio/podcast.mp3" type="audio/mpeg">
        <source src="audio/podcast.ogg" type="audio/ogg">
        Tu navegador no soporta audio HTML5.
    </audio>

    <p>Mira nuestro video:</p>
    <video controls width="640" poster="https://picsum.photos/640/360">
        <source src="video/presentacion.mp4" type="video/mp4">
        Tu navegador no soporta video HTML5.
    </video>
</body>
</html>

<!--
Creá un archivo multimedia.html con los siguientes elementos. Para los archivos de audio y 
video podés usar rutas ficticias (el navegador no va a reproducirlos, pero el HTML debe 
estar bien formado). 
 
• Un elemento <audio> con controles visibles y al menos dos formatos de fuente 
(<source>). Que tenga un mensaje de fallback para navegadores que no soporten 
audio HTML5. 

• Un elemento <video> con controles, un ancho de 640px, y un atributo poster que 
apunte a una imagen de picsum.photos. También con mensaje de fallback. 
• Un párrafo antes de cada elemento explicando qué es (ej: "Escuchá nuestro 
podcast:"). 
 
¿Qué diferencia hay entre los atributos controls, autoplay y muted? ¿En qué caso usarías 
autoplay? 
-->
